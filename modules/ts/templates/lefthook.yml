pre-commit:
  # Serial: parallel hooks race concurrent builds writing the same output directories.
  parallel: false
  commands:
    biome:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc}"
      run: pnpm biome check --staged --no-errors-on-unmatched
    typecheck:
      glob: "*.{ts,tsx}"
      run: pnpm typecheck
